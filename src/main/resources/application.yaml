spring:
  application:
    name: issueflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/issueflow
    username: issueflow
    password: issueflow
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

server:
  port: 8080

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.issueflow: DEBUG

jwt:
  secret: "change-this-secret-to-a-long-random-string"
  expiration-seconds: 3600

file:
  max-size-bytes: 10485760
  allowed-content-types:
    - image/png
    - image/jpeg
    - application/pdf
    - text/plain
  storage-dir: ./attachments

escalation:
  cron: "0 0 * * * *" # every hour
